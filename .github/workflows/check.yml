# Runs on every push and pull request: project checks, Teams/Copilot schema validation,
# and a rebuild to prove index.html matches app.html.
name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Rebuild index.html and confirm nothing changed
        run: |
          python3 build.py
          git diff --exit-code -- index.html || (echo "index.html is stale: run python3 build.py and commit" && exit 1)
      - run: node check.js
      - run: node tools/validate-teams.js
      - run: python3 tools/package-teams.py
  ui:
    # Browser tests: skill lessons and Facilitator mode (U1), and the cross-device and settings matrix (U2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: python3 build.py
      - run: node tools/ui-smoke.js
      - run: node tools/ui-matrix.js
