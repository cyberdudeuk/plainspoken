# On a version tag (v2.4.0 etc.): run the checks, build the Teams packages and attach them to a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node check.js && node tools/validate-teams.js
      - run: python3 tools/package-teams.py
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Plainspoken $GITHUB_REF_NAME" --notes "See CHANGELOG.md. Install guide: DEPLOYMENT-M365.md."
