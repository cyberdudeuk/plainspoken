name: Commercial use request
description: Ask for written permission to use Plainspoken commercially
labels:
- licensing
body:
- type: markdown
  attributes:
    value: 'Not-for-profit organisations and purposes are already permitted (see NOTICE). Don''t include confidential information here: issues are public.'
- type: input
  id: org
  attributes:
    label: Organisation
  validations:
    required: true
- type: textarea
  id: use
  attributes:
    label: Intended use
    description: What you want to do, who it's for and whether you will charge
  validations:
    required: true
